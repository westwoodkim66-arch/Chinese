<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>生活中文互動單字卡｜中・泰・英</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--text:#1f2937;--muted:#6b7280;--accent:#2563eb;--border:#e5e7eb;}
*{box-sizing:border-box} body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","Noto Sans Thai",sans-serif;background:var(--bg);color:var(--text)}
.wrap{max-width:850px;margin:auto;padding:18px} .toolbar{display:flex;gap:10px;flex-wrap:wrap} input,select,button{font:inherit}
input,select{padding:12px 14px;border:1px solid var(--border);border-radius:12px;background:#fff} input{flex:1;min-width:220px}
.card{background:var(--card);border:1px solid var(--border);border-radius:22px;padding:28px;margin-top:16px}
.word{font-size:clamp(64px,14vw,118px);font-weight:800;text-align:center;line-height:1} .pinyin{font-size:28px;text-align:center;color:var(--muted);margin-top:10px}
.meanings{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px} .box{background:#f9fafb;padding:14px;border-radius:14px}
.btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:18px} button{border:0;border-radius:12px;padding:12px 16px;cursor:pointer}
.primary{background:var(--accent);color:#fff} .secondary{background:#eef2ff;color:#1e3a8a} .nav{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
hr{border:0;border-top:1px solid var(--border);margin:26px 0} .sentence{font-size:30px;font-weight:700;line-height:1.45} .spinyin{font-size:18px;color:var(--muted);margin-top:6px}
.trans{margin-top:14px;line-height:1.7} .status{min-height:24px;text-align:right;color:var(--muted);font-size:14px} .counter{color:var(--muted);font-size:14px}
@media(max-width:600px){.meanings{grid-template-columns:1fr} .sentence{font-size:25px} .wrap{padding:12px} .card{padding:20px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="toolbar">
    <input id="search" type="search" placeholder="搜尋中文、拼音、ไทย、English…">
    <select id="category">

      <option value="food">飲食</option><option value="shopping">購物</option><option value="place">地點</option>
      <option value="transport">交通</option><option value="time">時間</option><option value="feeling">感受</option>

  <div style="display:flex;justify-content:space-between;gap:12px;margin-top:10px">
    <div id="counter" class="counter"></div><div id="status" class="status"></div>
  </div>
  <div class="card">
    <div id="word" class="word"></div>
    <div id="pinyin" class="pinyin"></div>
    <div class="meanings">
      <div class="box"><small>🇹🇭 ไทย</small><div id="thai" style="font-size:20px;margin-top:4px"></div></div>
      <div class="box"><small>🇬🇧 English</small><div id="english" style="font-size:20px;margin-top:4px"></div></div>
    </div>
    <div class="btns">
      <button class="primary" data-kind="word" data-rate=".75">🔊 單字 0.75× 慢速</button>
      <button class="secondary" data-kind="word" data-rate="1">🔊 單字 1× 正常</button>
    </div>
    <hr>
    <div><small>例句</small></div>
    <div id="sentence" class="sentence"></div>
    <div id="sentencePinyin" class="spinyin"></div>
    <div class="trans">🇹🇭 <span id="sentenceThai"></span><br>🇬🇧 <span id="sentenceEnglish"></span></div>
    <div class="btns">
      <button class="primary" data-kind="sentence" data-rate=".75">🔊 例句 0.75× 慢速</button>
      <button class="secondary" data-kind="sentence" data-rate="1">🔊 例句 1× 正常</button>
    </div>
  </div>
  <div class="nav">
    <button id="prev" class="secondary">← 上一個</button>
    <button id="next" class="primary">下一個 →</button>
  </div>
  <p style="font-size:13px;color:var(--muted);line-height:1.6">發音使用瀏覽器 / 裝置內建中文語音，優先選擇 zh-TW。不同裝置的聲音可能略有差異。</p>
</div>

let filtered=[...data], index=0;
const $=id=>document.getElementById(id);
function render(){
  if(!filtered.length){$('word').textContent='找不到';$('pinyin').textContent='';$('thai').textContent='ไม่พบคำศัพท์';$('english').textContent='No results';$('sentence').textContent='請換一個搜尋條件。';$('sentencePinyin').textContent='';$('sentenceThai').textContent='';$('sentenceEnglish').textContent='';$('counter').textContent='0 / 0';return;}
  index=Math.max(0,Math.min(index,filtered.length-1)); const d=filtered[index];
  ['word','pinyin','thai','english','sentence','sentencePinyin','sentenceThai','sentenceEnglish'].forEach((k,i)=>$(k).textContent=d[i]);
  $('counter').textContent=`${index+1} / ${filtered.length}`;
}
function applyFilter(){
  const q=$('search').value.trim().toLowerCase(), c=$('category').value;
  filtered=data.filter(d=>(c==='all'||d[8]===c)&&(!q||d.slice(0,8).some(v=>String(v).toLowerCase().includes(q))));
  index=0;render();
}
function chooseVoice(){
  const vs=speechSynthesis.getVoices(); return vs.find(v=>/zh-TW/i.test(v.lang))||vs.find(v=>/^zh/i.test(v.lang))||null;
}
function speak(text,rate){
  if(!('speechSynthesis' in window)){$('status').textContent='此瀏覽器不支援語音播放';return;}
  speechSynthesis.cancel();

  const requestedRate = Number(rate) || 1;
  // 部分瀏覽器／zh-TW 系統語音會把 0.75 與 1.0 的差異壓得很小，
  // 因此慢速模式做實際播放速率校正，讓聽感確實明顯慢於正常速度。
  const actualRate = requestedRate < 1 ? 0.55 : 1;

  const u=new SpeechSynthesisUtterance(text);
  u.lang='zh-TW';
  u.rate=actualRate;
  u.pitch=1;
  u.volume=1;

  const v=chooseVoice(); if(v) u.voice=v;
  u.onstart=()=>$('status').textContent=requestedRate<1?'🔊 慢速播放中':'🔊 正常速度播放中';
  u.onend=()=>$('status').textContent='';
  u.onerror=()=>$('status').textContent='播放失敗，請確認裝置已安裝中文語音';
  speechSynthesis.speak(u);
}
document.querySelectorAll('[data-kind]').forEach(b=>b.addEventListener('click',()=>{if(!filtered.length)return;const d=filtered[index];speak(b.dataset.kind==='sentence'?d[4]:d[0],b.dataset.rate)}));
$('prev').onclick=()=>{if(filtered.length){index=(index-1+filtered.length)%filtered.length;render()}};
$('next').onclick=()=>{if(filtered.length){index=(index+1)%filtered.length;render()}};
$('search').addEventListener('input',applyFilter); $('category').addEventListener('change',applyFilter);
if('speechSynthesis' in window) speechSynthesis.getVoices(); render();
</script>
